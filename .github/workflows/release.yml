name: Release

# Push a tag like "v0.3.0" (matching Cargo.toml's `version`) to build native
# binaries for Windows/Linux/macOS and publish them as a GitHub Release.
#
# Two things read these release assets:
#  - craftmjne-<target-triple>.<zip|tar.gz>: a complete, self-contained game
#    build (executable + blocks/ + textures/). This is what the launcher
#    downloads and extracts into versions/<version>/, and what a manual
#    download gives you. It MUST stay self-contained - the game refuses to
#    start without blocks/ next to its executable (see src/blocks.rs's
#    find_blocks_dir), and the launcher just unpacks the archive as-is.
#  - CraftmjneSetup.exe: the first-time installer, which installs the
#    *launcher* (installer/craftmjne.nsi). The launcher takes it from there.
#
# The launcher updates itself from its own branch instead of from these
# releases - see .github/workflows/launcher-release.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel Mac (x86_64-apple-darwin) used to build here on macos-13,
          # but that runner label has zero available hosted-runner capacity
          # as of the v1.1.1 release attempt - the job sat "queued" with no
          # runner assigned at all (not just slow/flaky) and, because
          # `release` below needs *every* matrix leg to reach a terminal
          # state, blocked the whole release indefinitely (`!cancelled()`
          # only helps once a run actually finishes; it can't rescue a job
          # that never gets scheduled). Re-add an Intel Mac leg if GitHub
          # brings back a working runner image for it - Apple Silicon
          # (macos-14 above) covers all Macs sold since 2020 in the
          # meantime, and Rosetta 2 runs the aarch64 build on Intel Macs too.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Build game
        run: cargo build --release --target ${{ matrix.target }} -p craftmjne

      - name: Build launcher
        run: cargo build --release --target ${{ matrix.target }} -p craftmjne-launcher

      # Everything the game needs to run, staged in one folder, so both
      # archive formats below are built from an identical layout.
      - name: Stage game files
        shell: bash
        run: |
          stage="stage/craftmjne"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/craftmjne${{ runner.os == 'Windows' && '.exe' || '' }}" "$stage/"
          cp -r blocks "$stage/blocks"
          # The whole directories, not just their READMEs - a past version of
          # this step copied only textures/blocks/README.md, which silently
          # shipped every released build with the procedural placeholder art
          # for every block even though real textures (dirt.png, stone.png)
          # existed right there in the repo the whole time.
          cp -r textures "$stage/textures"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar czf "craftmjne-${{ matrix.target }}.tar.gz" -C stage/craftmjne .

      # Note the `\*` - it archives the folder's *contents*, so the game
      # executable and blocks/ land at the root of the zip. The launcher
      # extracts an archive straight into versions/<version>/, so an extra
      # wrapping directory here would put blocks/ one level away from the
      # executable and the game would refuse to start.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path stage\craftmjne\* -DestinationPath craftmjne-${{ matrix.target }}.zip

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Build Windows installer (installs the launcher)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          # NSIS resolves relative `File` paths against the .nsi script's own
          # directory (installer/), not the working directory - SRC_EXE must
          # be absolute or it silently resolves to installer/target/... and
          # fails with "no files found".
          $srcExe = Join-Path "${{ github.workspace }}" "target\${{ matrix.target }}\release\craftmjne-launcher.exe"
          & 'C:\Program Files (x86)\NSIS\makensis.exe' `
            "-DAPP_VERSION=$version" `
            "-DSRC_EXE=$srcExe" `
            installer\craftmjne.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: craftmjne-${{ matrix.target }}
          path: |
            craftmjne-${{ matrix.target }}.tar.gz
            craftmjne-${{ matrix.target }}.zip
            CraftmjneSetup.exe
          if-no-files-found: ignore

  release:
    needs: build
    # Publish whatever platforms did build even if one leg failed - a
    # single failed/cancelled matrix leg would otherwise silently skip this
    # job and the whole release. `!cancelled()` still skips if the whole
    # run was cancelled. Note this only helps once every leg reaches a
    # terminal state; a leg that never gets a runner at all (stuck
    # "queued" forever) still blocks `needs: build` indefinitely - that's
    # why the matrix above no longer requests macos-13.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
