[package]
name = "craftmjne"
version = "1.2.2"
edition = "2021"
description = "A well-optimized, extensible voxel engine / Minecraft-style game framework"
license = "MIT"

[dependencies]
# Audio (bevy_audio), gamepad (bevy_gilrs) and native Wayland features are off
# so the project builds without ALSA/udev/libwayland system headers; add them
# back when you need them ("bevy_audio", "bevy_gilrs", "vorbis", "wayland").
# The X11 backend also covers Wayland desktops via XWayland.
bevy = { version = "0.16", default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "tonemapping_luts",
  "x11",
  "png", # the CRAFT_SMOKE=1 screenshot, and decoding hand-supplied textures/blocks/*.png (see atlas.rs)
] }
self_update = { version = "0.44.0", default-features = false, features = ["reqwest", "rustls", "archive-zip", "archive-tar", "compression-flate2", "compression-zip-deflate"] }
# Only for constructing the `Accept: application/octet-stream` header
# updater.rs needs on GitHub's release-asset API endpoint - the exact same
# `http` crate self_update itself depends on (see its `http_client` module),
# so the header types passed to `self_update::Download::set_header` line up.
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fast iteration: light optimization for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
