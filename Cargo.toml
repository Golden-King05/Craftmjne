[workspace]
members = ["launcher"]

[package]
name = "craftmjne"
version = "2.0.0"
edition = "2021"
description = "A well-optimized, extensible voxel engine / Minecraft-style game framework"
license = "MIT"

[dependencies]
# Audio is on and needs libasound2-dev on Linux. Native Wayland is off
# so the project builds without libwayland headers; add it back when you need it ("wayland"). Gamepads (bevy_gilrs) are
# on and need libudev-dev on Linux.
# The X11 backend also covers Wayland desktops via XWayland.
bevy = { version = "0.16", default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_audio", # sound (sound.rs); needs libasound2-dev to build on Linux
  "vorbis",     # .ogg files in resource packs
  "wav",        # .wav files, and the synthesised default sounds
  "bevy_color",
  "bevy_gilrs", # controllers (needs libudev-dev to build on Linux)
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "tonemapping_luts",
  "x11",
  "png", # the CRAFT_SMOKE=1 screenshot, and decoding hand-supplied textures/blocks/*.png (see atlas.rs)
] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS clipboard for Ctrl+C/Ctrl+V in chat (chat.rs) - "image-data" (pulls in
# `image`'s own clipboard-image support) is off, we only ever get/set text.
arboard = { version = "3", default-features = false }
# Compresses saved chunk snapshots (snapshot.rs). Already in the lockfile via
# the launcher's self_update, so this adds nothing to the download.
flate2 = "1"

# For reattaching to the launching terminal's console on Windows (main.rs) -
# needed once windows_subsystem = "windows" hides the console a release
# build would otherwise pop up, since that also silences --version/-V and
# any CLI error output when actually run from a terminal. Already in the
# tree via winit/wgpu, so this adds nothing to the download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
# Reads the fonts font_gen.rs writes, to check them (already in the tree via bevy_text).
ttf-parser = "0.25"

# Fast iteration: light optimization for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
